<header class="site-header">
  <div class="header-inner">
    <a routerLink="/" class="logo" (click)="goHome()">
      J<span class="color-primary-1">i</span>n<span class="color-primary-2">.</span>
    </a>

    <nav class="desktop-nav">
      <button type="button" class="nav-link" [class.active]="activeSection() === 'about-me'" (click)="navigateToSection('about-me')">
        {{ ts.t('nav.about') }}
      </button>
      <button type="button" class="nav-link" [class.active]="activeSection() === 'skills'" (click)="navigateToSection('skills')">
        {{ ts.t('nav.skills') }}
      </button>
      <button type="button" class="nav-link" [class.active]="activeSection() === 'portfolio'" (click)="navigateToSection('portfolio')">
        {{ ts.t('nav.portfolio') }}
      </button>
      <button type="button" class="nav-link" [class.active]="activeSection() === 'contact'" (click)="navigateToSection('contact')">
        {{ ts.t('nav.contact') }}
      </button>

      <div class="lang-switch">
        <button
          type="button"
          class="lang-btn"
          [class.active]="ts.currentLang() === 'de'"
          (click)="switchLang('de')"
        >
          DE
        </button>
        <button
          type="button"
          class="lang-btn"
          [class.active]="ts.currentLang() === 'en'"
          (click)="switchLang('en')"
        >
          EN
        </button>
      </div>
    </nav>

    <button
      type="button"
      class="burger-btn"
      [class.open]="menuOpen()"
      (click)="toggleMenu()"
      aria-label="Toggle Menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  @if (menuOpen()) {
    <div class="mobile-overlay">
      <button type="button" class="mobile-link" [class.active]="activeSection() === 'about-me'" (click)="navigateToSection('about-me')">
        {{ ts.t('nav.about') }}
      </button>
      <button type="button" class="mobile-link" [class.active]="activeSection() === 'skills'" (click)="navigateToSection('skills')">
        {{ ts.t('nav.skills') }}
      </button>
      <button type="button" class="mobile-link" [class.active]="activeSection() === 'portfolio'" (click)="navigateToSection('portfolio')">
        {{ ts.t('nav.portfolio') }}
      </button>
      <button type="button" class="mobile-link" [class.active]="activeSection() === 'contact'" (click)="navigateToSection('contact')">
        {{ ts.t('nav.contact') }}
      </button>

      <div class="lang-switch mobile-lang">
        <button
          type="button"
          class="lang-btn"
          [class.active]="ts.currentLang() === 'de'"
          (click)="switchLang('de')"
        >
          DE
        </button>
        <button
          type="button"
          class="lang-btn"
          [class.active]="ts.currentLang() === 'en'"
          (click)="switchLang('en')"
        >
          EN
        </button>
      </div>
    </div>
  }
</header>
