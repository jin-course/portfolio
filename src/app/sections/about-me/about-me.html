<section class="about-section">
  <img
    src="assets/img/shadows/purple-shadow-about.webp"
    alt=""
    class="bg-shadow"
    aria-hidden="true"
  />

  <div class="about-container">
    <div class="about-text">
      <h2>{{ ts.t('about.title') }}</h2>
      <p class="intro">{{ ts.t('about.intro') }}</p>

      <div class="info-item">
        <span class="icon icon-location"><img src="assets/icons/ui/location.svg" alt="Location" /></span>
        <p>{{ ts.t('about.location') }}</p>
      </div>

      <div class="info-item">
        <span class="icon icon-bulb"><img src="assets/icons/ui/bulb.svg" alt="Mindset" /></span>
        <p>{{ ts.t('about.mindset') }}</p>
      </div>

      <div class="info-item">
        <span class="icon icon-puzzle"><img src="assets/icons/ui/puzzle.svg" alt="Problem Solving" /></span>
        <p>{{ ts.t('about.problem') }}</p>
      </div>
    </div>

    <div class="about-visual">
      <div class="circle-frame">
        <img src="assets/img/profile/about-profile.webp" alt="Jinsoo Jang About" />
      </div>
      <span class="green-line"></span>
    </div>
  </div>
</section>
