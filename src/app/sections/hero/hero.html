<section class="hero-section">
  <div class="hero-content">
    <div class="portrait-wrapper">
      <img
        src="assets/img/profile/hero-profile.webp"
        alt="Jinsoo Jang Portrait"
        class="hero-portrait"
      />
    </div>

    <div class="intro-wrapper">
      <div class="title-group">
        <span class="vertical-text">{{ ts.t('hero.iam') }}</span>
        <div class="name-role">
          <h1>Jinsoo Jang</h1>
          <p class="role">{{ ts.t('hero.role') }}</p>
        </div>
      </div>

      <button type="button" class="cta-btn" (click)="scrollToSection('contact')">{{ ts.t('hero.cta') }}</button>
    </div>
  </div>

  <!-- 원안과 동일한 오목 대각선 곡선 배경 -->
  <svg
    class="hero-curve"
    viewBox="0 0 1440 420"
    preserveAspectRatio="none"
    aria-hidden="true"
  >
    <path
      d="M0,330 C420,370 980,260 1440,0 L1440,420 L0,420 Z"
      fill="#141d2f"
    />
  </svg>

  <div class="hero-bottom-bar">
    <div class="social-links">
      <span class="purple-line"></span>
      <a href="https://github.com/JinSooJang-DA" target="_blank" rel="noopener" aria-label="GitHub">
        <img src="assets/icons/social/github.svg" alt="GitHub" />
      </a>
      <a href="mailto:hello@iamjin.de" aria-label="Email">
        <img src="assets/icons/social/email.svg" alt="Email" />
      </a>
      <a href="https://linkedin.com" target="_blank" rel="noopener" aria-label="LinkedIn">
        <img src="assets/icons/social/linkedin.svg" alt="LinkedIn" />
      </a>
      <a href="mailto:hello@iamjin.de" class="email-text">hello@iamjin.de</a>
    </div>

    <button type="button" class="scroll-down" aria-label="Scroll down" (click)="scrollToSection('about-me')">
      <span>{{ ts.t('hero.scroll') }}</span>
      <svg width="22" height="24" viewBox="0 0 22 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 2v19M3 14l8 8 8-8"/>
      </svg>
    </button>
  </div>
</section>
