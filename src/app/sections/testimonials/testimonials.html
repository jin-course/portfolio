<section class="testimonials-section">
  <div class="testimonials-container">
    @if (testimonials[currentIndex()]; as item) {
      <div class="testimonial-stage">
        <!-- 좌측: 연두색 테두리 추천사 카드 + 상단 보라색 따옴표 -->
        <div class="quote-box">
          <img
            src="assets/icons/ui/quotes.svg"
            alt=""
            class="quote-mark"
            aria-hidden="true"
          />
          <p class="quote-text">{{ ts.t(item.quoteKey) }}</p>

          <div class="author-row">
            <span class="author-line"></span>
            <span class="author-name">{{ ts.t(item.authorKey) }}</span>
          </div>
        </div>

        <!-- 우측: 원형 프로필 프레임 + 연두색 가로선 -->
        <div class="avatar-wrapper">
          <div class="avatar-circle">
            <img [src]="item.avatar" [alt]="ts.t(item.authorKey)" />
          </div>
          <span class="green-connector"></span>
        </div>
      </div>
    }

    <!-- 하단 컨트롤: 좌우 화살표 & 페이지 인디케이터 점 -->
    <div class="slider-controls">
      <button type="button" class="nav-arrow prev" (click)="prev()" aria-label="Previous testimonial">
        <img src="assets/icons/ui/arrow.svg" alt="Previous" />
      </button>

      <div class="dots">
        @for (t of testimonials; track t.quoteKey; let idx = $index) {
          <button
            type="button"
            class="dot"
            [class.active]="currentIndex() === idx"
            (click)="select(idx)"
            [attr.aria-label]="'Slide ' + (idx + 1)"
          ></button>
        }
      </div>

      <button type="button" class="nav-arrow next" (click)="next()" aria-label="Next testimonial">
        <img src="assets/icons/ui/arrow.svg" alt="Next" />
      </button>
    </div>
  </div>
</section>
